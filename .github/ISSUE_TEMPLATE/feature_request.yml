name: ✨ 功能请求
description: 提议一个新功能或改进
title: "FEAT: <一句话描述>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提议 🙏

        在写之前请先确认：

        - 已经搜过现有 issues，没有重复（包括已关闭的）
        - 不是反作弊 / 微软签名相关的问题（这些走 [#1](https://github.com/GeekASMR/WDM2VST-Ultra/issues/1) 跟踪）

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 别先想方案，先描述场景。我们想知道你卡在哪。
      placeholder: |
        例如：每次切换 DAW 工程时都要手动重新选择 IPC 通道，希望能自动记住上次选择。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你想到了什么实现方式？UI 长什么样？工作流是怎样的？
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法 / 已经在用的 workaround
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 涉及组件
      multiple: true
      options:
        - WDM2VST Ultra (W2V)
        - VST2WDM Ultra (V2W)
        - INST WDM2VST Ultra
        - Send Ultra / Receive Ultra (P2P)
        - 内核驱动 (WDM2VSTUltra.sys)
        - 安装器 (WDM2VST_Ultra_Setup.exe)
        - 文档 / FAQ
        - 不确定
    validations:
      required: false
